<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>DRVC</title>
<script>
(async () => {
  try {
    const response = await fetch("current-version.json", { cache: "no-store" });
    if (!response.ok) throw new Error("Unable to load current-version.json");
    const data = await response.json();
    const major = data.major;
    if (!Number.isInteger(major) || major < 0) {
      throw new Error("Invalid major version");
    }
    const target = new URL(`v${major}/`, location.href);
    target.search = location.search;
    target.hash = location.hash;
    location.replace(target.href);
  } catch (error) {
    console.error("DRVC redirect failed:", error);
    document.body.textContent = "Unable to locate the current DRVC version.";
  }
})();
</script>
</head>
<body></body>
</html>

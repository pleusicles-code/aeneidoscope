<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bibliography</title>
  <!-- Load EB Garamond from Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'EB Garamond', serif;
      font-size: 1.2em;
      max-width: 90%;
      margin: 2em auto;
      line-height: 1.4;
    }
    
    a:link {color: #5699C6; text-decoration: none;}
    a:visited {color: #5699C6; text-decoration: none;}


    h1 {
      text-align: center;
      margin-bottom: 0.5em;
      font-size: 2.5em;      
    }

    .intro {
      margin-bottom: 1.5em;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      border-bottom: 2px solid #444;
      text-align: left;
      padding: 4px 15px;
      vertical-align: top;
    }

    td {
      padding: 3px 15px;
      vertical-align: top;
    }

    .period-header td {
      font-weight: bold;
      font-size: 1.3em;
      text-align: center;
      padding-top: 1.2em;
      padding-bottom: 0.3em;
      background: none;
      border: none;
    }

    .markdown-cell p {
      margin: 0;
      padding: 0;
    }

    .commentator {
      font-weight: bold;
    }

    /* Notes column width limit */
    td.notes, th.notes {
    width: 30%;
    text-align: justify;
    font-size: 0.8em;
    word-wrap: break-word;
    }

  </style>
</head>
<body>

  <h1>List of Commentaries</h1>
  <div class="intro">
    <p>Bibliographic codes starting with LW and LA refer to records in Craig Kallendorf's <em>Bibliography of the Early Printed Editions of Virgil (1469-1850)</em>, New Castle, DE, 2012 (with online <a href="https://bibsite.org/Detail/objects/30">Addenda</a>).</p>
    
  </div>
  <table id="bib-table"></table>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    const periodStrings = [
      "Period 1 (Antiquity)",
      "Period 2 (Middle Ages and early humanism)",
      "Period 3 (Later humanism)",
      "Period 4 (Early modernity)",
      "Period 5 (Heyne and 19th c.)",
      "Period 6 (20th-21st c.)",
      "Miscellaneous columns",
    ];

    const csvUrl = "https://latin.elte.hu/copia/tabulator/bibliography.csv";

    Papa.parse(csvUrl, {
      download: true,
      header: true,
      complete: function(results) {
        const data = results.data.filter(row => row.Key && row.Key.trim() !== "");
        renderTable(data);
      }
    });

    function renderTable(data) {
      const table = document.getElementById("bib-table");
      let html = "<thead><tr>";
      html += "<th>Commentator</th><th>Date</th><th>Edition</th><th>Notes</th></tr></thead><tbody>";

      let lastPeriod = null;
      let stripeToggle = false;

      data.forEach(row => {
        const periodNum = parseInt(row.Period, 10);
        
        // Skip entirely if periodNum = 7
        if (periodNum === 7) return;

        if (!isNaN(periodNum) && periodNum !== lastPeriod) {
          html += `<tr class="period-header"><td colspan="4">${periodStrings[periodNum - 1]}</td></tr>`;
          lastPeriod = periodNum;
          stripeToggle = true; // reset for new section
        }

        const bgStyle = stripeToggle ? ' style="background: #f9f9f9;"' : '';
        html += `<tr${bgStyle}>`;
        html += `<td class="commentator">${row.Commentator || ""}</td>`;
        html += `<td>${row.Date || ""}</td>`;
        html += `<td class="markdown-cell">${renderMarkdown(row.Edition || "")}</td>`;
        html += `<td class="markdown-cell notes">${renderMarkdown(row.Notes || "")}</td>`;
        html += "</tr>";

        stripeToggle = !stripeToggle;
      });

      html += "</tbody>";
      table.innerHTML = html;
    }

    function renderMarkdown(text) {
      return marked.parseInline(text || "").replace(/<a /g, '<a target="_blank" rel="noopener noreferrer" ');
    }
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Victorinus Strigel</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/mirador@latest/dist/mirador.min.css">
  <style>
    html, body { height: 100%; margin: 0; }
    #viewer { height: 100vh; }
  </style>
</head>
<body>
  <div id="viewer"></div>

  <script src="https://unpkg.com/mirador@latest/dist/mirador.min.js"></script>
  <script>
    // --- CONFIG YOU CAN EDIT ---
    const DEFAULT_MANIFEST = "https://content.staatsbibliothek-berlin.de/dc/780077105/manifest";
    // ---------------------------

    // Read query params
    const QS = new URLSearchParams(location.search);
    const manifest = QS.get("manifest") || DEFAULT_MANIFEST;

    const win = {
      loadedManifest: manifest,
      // keep your canvasIndex / canvasId if you use them
    };    
    
    // map common aliases to Mirador's 'single' | 'book'
    const viewAlias = (QS.get("view") || "").toLowerCase();
    const viewMap = {
      "single": "single", "one": "single", "1": "single", "oneup": "single", "singlepage": "single",
      "book": "book", "two": "book", "2": "book", "twoup": "book", "paged": "book", "spread": "book"
    };
    const defaultView = viewMap[viewAlias] || "single";

    // Ways to specify start page:
    //   1) canvas=<full canvas ID>  (takes precedence)
    //   2) cv=<zero-based index>    (Mirador-style index)
    //   3) page=<1-based number>    (human-friendly; we convert to cv)
    const canvasId = QS.get("canvas");
    const hasCv    = QS.has("cv");
    const hasPage  = QS.has("page");
    const cvIndex  = hasCv  ? Math.max(0, parseInt(QS.get("cv"), 10) || 0)
                            : (hasPage ? Math.max(0, (parseInt(QS.get("page"), 10) || 1) - 1) : null);

    // Build Mirador window config
    const windowCfg = {
      loadedManifest: manifest,
      thumbnailNavigationPosition: 'far-bottom', // nice for codices
    };
    if (canvasId) {
      windowCfg.canvasId = canvasId;        // exact canvas URL
    } else if (cvIndex !== null) {
      windowCfg.canvasIndex = cvIndex;      // 0-based index
    }

    // Optional: also add the manifest to the left "catalog" panel
    const catalogEntry = { manifestId: manifest, provider: "Manifest" };

    // Launch Mirador
    Mirador.viewer({
      id: "viewer",
      windows: [ windowCfg ],
      catalog: [ catalogEntry ],
      window: {
        allowClose: false,
        allowMaximize: true,
        defaultView: 'single',    // 'single' or 'book'
        views: [
          { key: 'single', behaviors: ['paged', 'individuals', 'continuous', 'facing-pages'] },
          { key: 'book' },
          { key: 'scroll' },
          { key: 'gallery' },
        ],        
        sideBarOpenByDefault: false,
      },
      workspaceControlPanel: { enabled: true },
    });
  </script>
</body>
</html>
